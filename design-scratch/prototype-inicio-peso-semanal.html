<!doctype html>
<html lang="es"><head><meta charset="utf-8" /><title>Morphy — Peso de esta semana</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700&display=swap");
:root { --bg:#15141b; --surface:#242330; --text:#f8fafc; --text-muted:#9ca3af; --accent:#7557e8; --border:#3a3848; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:"Inter",sans-serif; }
.screen { max-width:420px; margin:0 auto; padding:16px 14px 40px; }
.modal-card { border-radius:20px; border:1px solid var(--border); background:var(--surface); padding:16px; }
h1 { font-family:"Poppins",sans-serif; font-style:italic; font-weight:600; font-size:16px; margin:0 0 10px; color:var(--accent); }
.note { font-size:11px; color:var(--text-muted); margin-bottom:10px; }
input { background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:18px; font-weight:700; text-align:center; padding:14px; width:100%; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
button { border:none; border-radius:10px; padding:12px; font-weight:700; font-size:13px; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text-muted); }
.btn-violet { background:var(--accent); color:#fff; }
.editable-tag { position:fixed; bottom:10px; right:10px; background:var(--surface); border:1px solid var(--accent); color:var(--accent); font-family:"Poppins",sans-serif; font-size:9px; text-transform:uppercase; letter-spacing:.08em; padding:5px 10px; border-radius:999px; opacity:.85; }
</style></head>
<body>
<div class="editable-tag">EDITABLE — .html local</div>
<div class="screen">
  <div class="modal-card">
    <h1>⚖️ Peso de esta semana</h1>
    <div class="note">Registralo una vez por semana para seguir tu evolución.</div>
    <input type="number" placeholder="Ej: 82.4"/>
    <div class="row2"><button class="btn-outline">Cancelar</button><button class="btn-violet">Guardar</button></div>
  </div>
</div>
</body></html>
